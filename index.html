<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020408">
<title>Earth</title>
<link rel="stylesheet" href="style.css?v=terrain-coast-fix-20261120-v2">
</head>
<body>
<canvas id="earth" aria-label="마우스로 회전 및 확대할 수 있는 지구 3D 모델"></canvas>
<button id="terrain-toggle" class="mode-toggle" type="button" aria-pressed="false" aria-controls="terrain-hud" title="고도 확인 모드 (H)">
  <span class="mode-icon" aria-hidden="true">△</span>
  <span id="mode-toggle-label">고도 확인</span>
  <span class="mode-shortcut" aria-hidden="true">H</span>
</button>
<div id="terrain-hud" hidden aria-live="polite">
  <div class="hud-head">
    <strong>고도 확인 모드</strong>
    <span>육지 · 해저 지형 확인</span>
  </div>
  <div class="terrain-ruler">
    <div class="terrain-row"><label for="terrain-slider">높이 강조</label><output id="terrain-scale" for="terrain-slider">20×</output></div>
    <input id="terrain-slider" type="range" min="0" max="24" step="1" value="20" aria-label="고도 변형 확대 배율">
    <div class="hud-labels"><span>0×</span><span>24×</span></div>
    <p class="displacement-note">정점 변화 <strong id="terrain-displacement">+2.76% / −2.08%</strong></p>
    <button id="terrain-compare" class="compare-btn" type="button">0× / 현재 배율 비교</button>
  </div>
  <div class="legend-block">
    <div class="hud-legend-label">바다 깊이</div>
    <div class="hud-ramp ramp-ocean" role="img" aria-label="깊은 바다는 어두운 파랑, 얕은 바다는 밝은 청록색"></div>
    <div class="hud-labels"><span>깊음</span><span>얕음</span></div>
  </div>
  <div class="legend-block">
    <div class="hud-legend-label">육지 고도</div>
    <div class="hud-ramp" role="img" aria-label="낮은 지형은 녹색, 높은 지형은 갈색과 흰색"></div>
    <div class="hud-labels"><span>낮음</span><span>중간</span><span>높음</span></div>
  </div>
  <p class="hud-note">육지·바다 경계: 해안선 마스크 / 높낮이: 공개 지형도 기반 상대값 (실측 수치 DEM 아님)</p>
</div>
<div id="error" hidden></div>
<script src="main.js?v=terrain-coast-fix-20261120-v2"></script>
</body>
</html>
